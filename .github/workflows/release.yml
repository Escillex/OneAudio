name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install PyAudioWPatch pyinstaller
          choco install innosetup -y --no-progress

      - name: Build
        run: .\build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist\OneAudio-Setup-*.exe dist\oneaudio-send.exe dist\oneaudio-receive.exe `
            --title $env:GITHUB_REF_NAME --generate-notes
